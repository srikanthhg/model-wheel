resources:
  jobs:
    model_wheel_deploy:
      name: model-wheel-${bundle.target}-deploy
      description: Build and register the model-wheel agent in Unity Catalog, promote Champion, and reconcile its serving endpoint.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tasks:
        - task_key: register_and_serve
          description: Log the MLflow pyfunc agent, register the UC model, promote Champion, and create or update Model Serving.
          python_script_task:
            python_file: ../scripts/register_model.py
            source: WORKSPACE
            parameters:
              - --model-name
              - ${var.catalog}.${var.schema}.demo_agent
              - --llm-model
              - ${var.llm_model}
              - --serving-endpoint
              - ${var.serving_endpoint}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"
            dependencies:
              - ../dist/*.whl
              - databricks-langchain==0.6.0
              - langchain==0.3.14
              - langchain-core==0.3.29
              - "mlflow>=3.1,<4"
              - "databricks-sdk>=0.50,<1"
